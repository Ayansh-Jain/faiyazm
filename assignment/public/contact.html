<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Madath Good Startups</title>
    <style>
        body {
            background-color: #0d133d;
            color: #f5f5dc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            color: #d4af37;
            font-family: 'Georgia', serif;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        h2,
        h3 {
            color: #d4af37;
        }

        p,
        ul {
            margin-bottom: 15px;
            opacity: 0.9;
        }

        a {
            color: #d4af37;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #f5f5dc;
            opacity: 0.7;
        }

        .back-link:hover {
            opacity: 1;
            color: #d4af37;
        }

        .contact-container {
            display: grid;
            gap: 40px;
            margin-top: 30px;
        }

        .contact-method {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #d4af37;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #fff;
            border-radius: 4px;
        }

        button {
            background: #d4af37;
            color: #0d133d;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #e5c158;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Home</a>

        <h1>Contact Us</h1>

        <p>We would love to hear from you. Whether you have a question about our initiatives, want to partner with us,
            or just want to say hello.</p>

        <div class="contact-container">
            <div class="contact-info">
                <div class="contact-method">
                    <h3>Email Us</h3>
                    <p>For general inquiries: <a href="mailto:info@madath.com">info@madath.com</a></p>
                </div>

                <div class="contact-method">
                    <h3>Call Us</h3>
                    <p>Mon-Fri from 9am to 6pm: <a href="tel:+918951172002">+91 89511 72002</a></p>
                </div>

                <div class="contact-method">
                    <h3>Visit Us</h3>
                    <p>Hyderabad, India</p>
                </div>
            </div>

            <form action="mailto:info@madath.com" method="post" enctype="text/plain">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="john@example.com">
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required placeholder="How can we help?">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required
                        placeholder="Your message here..."></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>
</body>

</html>
